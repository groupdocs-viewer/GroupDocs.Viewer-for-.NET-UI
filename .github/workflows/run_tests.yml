name: Run Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.csproj'
      - 'Directory.Build.props'
      - 'build/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.sln'
      - '*.csproj'
      - 'Directory.Build.props'
      - 'build/**'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The test project multi-targets net6.0/net8.0/net10.0, so a single `dotnet test`
      # already exercises all three. Every one of those runtimes has to be installed for
      # the inner builds to start - a matrix that installed one SDK per leg left the other
      # two TFMs unable to run, which failed the build while still reporting 0 errors.
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore ./GroupDocs.Viewer.UI.sln

      - name: Build solution
        run: dotnet build ./GroupDocs.Viewer.UI.sln --no-restore --configuration Release

      # LogFilePrefix, not LogFileName: with a fixed name all three TFMs write the same
      # trx and overwrite each other, so only one framework's results survive.
      - name: Run tests
        run: dotnet test ./tests/GroupDocs.Viewer.UI.Api.Tests/GroupDocs.Viewer.UI.Api.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFilePrefix=test-results" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results_*.trx
            **/coverage.cobertura.xml
          retention-days: 30


  publish-test-results:
    name: "Publish Tests Results"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    if: always()

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: test-results-*
          merge-multiple: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/*.trx"
          check_name: "Test Results"
          comment_mode: always 
          report_individual_runs: true
          fail_on: "test failures"
